# OpenOCD configuration for the Wildfire STM32F103C8T6 board through ST-LINK.
# Keep PA13/SWDIO, PA14/SWCLK, NRST, 3V3, and GND connected to the probe.

source [find interface/stlink.cfg]
transport select swd

# STM32F103C8T6 has 20 KB SRAM.  Use a conservative flash work area so the
# same config also works with boards that keep a small monitor/debug stack.
set WORKAREASIZE 0x4000

source [find target/stm32f1x.cfg]

adapter speed 1000
reset_config srst_nogate
