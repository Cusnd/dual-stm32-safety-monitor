<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>环境安全数据看板</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p data-i18n="subtitle">MONITOR USART1 / CH340C</p>
          <h1 data-i18n="title">环境安全数据看板</h1>
        </div>
        <nav class="actions" aria-label="Dashboard actions">
          <button id="languageButton" type="button">EN</button>
          <button id="connectButton" type="button">
            <span class="button-icon" aria-hidden="true">COM</span>
            <span data-label>连接串口</span>
          </button>
          <button id="disconnectButton" type="button">
            <span class="button-icon" aria-hidden="true">OFF</span>
            <span data-label>断开</span>
          </button>
          <button id="simulationButton" type="button">
            <span class="button-icon" aria-hidden="true">SIM</span>
            <span data-label>开始模拟</span>
          </button>
        </nav>
      </header>

      <section class="status-row" aria-live="polite">
        <div>
          <span>Serial</span>
          <strong id="connectionState" data-state="disconnected">未连接</strong>
        </div>
        <div>
          <span>Data</span>
          <strong id="dataState" data-state="empty">等待数据</strong>
        </div>
        <div>
          <span id="lastUpdate">最后更新: --</span>
          <strong id="supportMessage" hidden></strong>
        </div>
      </section>

      <section id="metricGrid" class="metric-grid" aria-label="Live sensor values"></section>

      <section class="workspace">
        <article class="chart-panel">
          <div class="panel-heading">
            <h2 data-i18n="trend">最近趋势</h2>
            <div class="chart-key" aria-hidden="true">
              <span class="temp-key">T</span>
              <span class="humi-key">H</span>
              <span class="mq2-key">MQ2</span>
              <span class="mq135-key">MQ135</span>
              <span class="rain-key">RAIN</span>
              <span class="therm-key">N</span>
            </div>
          </div>
          <canvas id="trendChart" aria-label="Recent sensor trend chart"></canvas>
        </article>

        <aside class="side-panel">
          <div id="detailGrid" class="detail-grid"></div>

          <section class="ai-panel" aria-live="polite">
            <div class="panel-heading">
              <h2 data-i18n="aiInsights">AI 洞察</h2>
              <span id="aiProviderBadge" class="provider-badge">本地规则</span>
            </div>
            <div class="risk-strip">
              <span data-i18n="aiRisk">风险等级</span>
              <strong id="aiRiskValue" data-risk="unknown">等待数据</strong>
            </div>
            <p id="aiSummary" class="ai-summary"></p>
            <div class="ai-grid">
              <section>
                <h3 data-i18n="aiEvidence">主要证据</h3>
                <ul id="aiEvidence"></ul>
              </section>
              <section>
                <h3 data-i18n="aiTrends">趋势判断</h3>
                <ul id="aiTrends"></ul>
              </section>
              <section>
                <h3 data-i18n="aiActions">建议动作</h3>
                <ul id="aiActions"></ul>
              </section>
            </div>
          </section>

          <section class="chat-panel">
            <h2 data-i18n="aiChat">用户对话</h2>
            <ul id="chatMessages" aria-live="polite"></ul>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" name="message" type="text" autocomplete="off" placeholder="现在安全吗？">
              <button id="chatSubmit" type="submit">
                <span class="button-icon" aria-hidden="true">&gt;</span>
                <span data-label>发送</span>
              </button>
            </form>
          </section>
        </aside>
      </section>

      <section class="event-panel">
        <h2 data-i18n="log">串口事件</h2>
        <ul id="eventLog"></ul>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
